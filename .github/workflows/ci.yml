name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The frozen model artifact and the raw CICIDS2017 CSVs are not
      # committed. Tests that need them skip with an explicit reason.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scikit-learn joblib scapy

      - name: Compile sources
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest -q
